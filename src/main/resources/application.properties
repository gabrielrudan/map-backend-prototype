spring.application.name=map-backend-prototype

spring.datasource.url=jdbc:postgresql://localhost:5432/map_backend_db
spring.datasource.username=map_backend_user
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
